# Copiar a: /etc/nginx/sites-available/draw.ausarta.net
# Mismo patrón que ticketsmovil.ausarta.net y nop.ausarta.net (nginx host + Certbot).
# Backend: docker-compose.host-nginx.yml en 127.0.0.1:8015

server {
    server_name draw.ausarta.net;

    client_max_body_size 20M;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
