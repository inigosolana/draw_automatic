# Copiar a: /etc/nginx/sites-available/draw.ausarta.net
# Cambiar TU_IP_PUBLICA por la IP desde la que acceden los tecnicos.
# Certificado: autofirmado (como Portainer) o Let's Encrypt si lo tienes.

server {
    listen 443 ssl http2;
    server_name draw.ausarta.net;

    ssl_certificate     /etc/nginx/ssl/draw.crt;
    ssl_certificate_key /etc/nginx/ssl/draw.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Solo IPs de confianza (una linea allow por tecnico u oficina)
    allow 45.141.240.254;
    # allow 203.0.113.50;
    deny all;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
