<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Previsualización - {{ filename }}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/ausarta-drawio-32.png') }}?v={{ static_v }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/ausarta-drawio-180.png') }}?v={{ static_v }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ static_v }}">
  </head>
  <body>
    <main class="preview-page">
      <header class="preview-toolbar">
        <img class="preview-logo" src="{{ url_for('static', filename='images/ausarta-logo-light.png') }}?v={{ static_v }}" alt="Ausarta">
        <strong>{{ filename }}</strong>
        <span>Previsualización previa a GLPI</span>
      </header>
      <iframe
        id="drawio-preview"
        class="drawio-preview"
        src="{{ preview_base_url }}/?embed=1&ui=min&spin=1&proto=json&libraries=1"
        title="Previsualización del diagrama"
      ></iframe>
    </main>
    <script type="application/json" id="drawio-preview-config"{% if csp_nonce is defined %} nonce="{{ csp_nonce() }}"{% endif %}>{{ {"xml": xml} | tojson }}</script>
    <script src="{{ url_for('static', filename='js/preview-drawio.js') }}?v={{ static_v }}"></script>
  </body>
</html>
