<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Previsualización - {{ filename }}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/ausarta-drawio-32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/ausarta-drawio-180.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="preview-page">
      <header class="preview-toolbar">
        <img class="preview-logo" src="{{ url_for('static', filename='images/ausarta-logo-light.png') }}" alt="Ausarta">
        <strong>{{ filename }}</strong>
        <span>Previsualización previa a GLPI</span>
      </header>
      <iframe
        id="drawio-preview"
        class="drawio-preview"
        src="{{ preview_base_url }}/?embed=1&ui=min&spin=1&proto=json&libraries=1"
        title="Previsualización del diagrama"
      ></iframe>
    </main>
    <script>
      const frame = document.getElementById("drawio-preview");
      const xml = {{ xml_json | safe }};
      window.addEventListener("message", event => {
        if (event.source !== frame.contentWindow) return;
        let message;
        try { message = JSON.parse(event.data); } catch (_) { return; }
        if (message.event === "init") {
          frame.contentWindow.postMessage(JSON.stringify({
            action: "load",
            xml,
            autosave: 0
          }), "*");
        }
      });
    </script>
  </body>
</html>
