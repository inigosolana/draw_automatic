<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso - Ausarta Draw.io</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/ausarta-drawio-32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/ausarta-drawio-180.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="page login-page">
      <section class="panel login-panel">
        <header class="panel-header">
          <div class="login-brand">
            <img src="{{ url_for('static', filename='images/ausarta.png') }}" alt="Ausarta">
            <span>Diagramas de red</span>
          </div>
          <h1>Acceso de técnicos</h1>
          <p>Utiliza el mismo usuario y contraseña que en GLPI.</p>
        </header>
        {% if error %}<div class="message error">{{ error }}</div>{% endif %}
        <form method="post" action="{{ request.full_path }}" autocomplete="on">
          <label for="glpi-username">Usuario GLPI
            <input
              id="glpi-username"
              type="text"
              name="username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
              autofocus
            >
          </label>
          <label for="glpi-password">Contraseña
            <input
              id="glpi-password"
              type="password"
              name="password"
              autocomplete="current-password"
              required
            >
          </label>
          <button class="button primary" type="submit">Entrar</button>
        </form>
        <p class="helper-text">La contraseña se envía a GLPI para validarla y no se almacena.</p>
      </section>
    </main>
  </body>
</html>
