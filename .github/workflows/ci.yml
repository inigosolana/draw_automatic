name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Prepare test library
        run: |
          mkdir -p library
          cp tests/fixtures/test_library.xml library/libreria_Ausarta_JUN_2026.xml

      - name: Run tests
        run: pytest tests/ -v --tb=short
