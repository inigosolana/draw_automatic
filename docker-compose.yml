# Despliegue CANÓNICO y seguro de draw_automatic.
#
# La app escucha en 127.0.0.1:8015; el acceso público lo termina el Nginx DEL
# HOST (systemd) en 443 con Let's Encrypt (certbot.timer). Este compose NO
# levanta nginx ni certbot: los gestiona el host.
#
#   docker compose up -d --build
#
# Composes obsoletos (portainer*) archivados en deploy/legacy/ — no usar.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  drawio-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: ausarta-drawio:latest
    container_name: ausarta-drawio
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8015:8000"
    environment:
      GLPI_URL: "${GLPI_URL}"
      GLPI_WEB_URL: "${GLPI_WEB_URL}"
      GLPI_APP_TOKEN: "${GLPI_APP_TOKEN}"
      GLPI_USER_TOKEN: "${GLPI_USER_TOKEN}"
      GLPI_VERIFY_SSL: "${GLPI_VERIFY_SSL:-1}"
      GLPI_CA_BUNDLE: "${GLPI_CA_BUNDLE:-}"
      CRM_API_URL: "${CRM_API_URL:-}"
      CRM_API_TOKEN: "${CRM_API_TOKEN:-}"
      CRM_WORK_ORDER_PATH: "${CRM_WORK_ORDER_PATH:-/WorkOrders/getWorkOrderForDraw/{work_order_id}}"
      CRM_API_TIMEOUT: "${CRM_API_TIMEOUT:-20}"
      COMMS_URL: "${COMMS_URL:-https://comms.aureamotriz.com}"
      COMMS_USERNAME: "${COMMS_USERNAME:-}"
      COMMS_PASSWORD: "${COMMS_PASSWORD:-}"
      COMMS_API_TOKEN: "${COMMS_API_TOKEN:-}"
      DRAWIO_LIBRARY_PATH: "/app/library/${DRAWIO_LIBRARY_VERSION:-libreria_Ausarta_JUN_2026}.xml"
      DRAWIO_DOWNLOAD_DB: "/app/data/downloads.sqlite3"
      DRAWIO_SITE_DB: "/app/data/sites.sqlite3"
      DRAWIO_CATALOG_DB: "/app/data/catalog.sqlite3"
      DRAWIO_ACTIVITY_DB: "/app/data/activity.sqlite3"
      DRAWIO_SECLOG_DB: "/app/data/security.sqlite3"
      DRAWIO_CATALOG_TTL: "${DRAWIO_CATALOG_TTL:-300}"
      DRAWIO_DOWNLOAD_TTL: "${DRAWIO_DOWNLOAD_TTL:-86400}"
      DRAWIO_MAX_UPLOAD_BYTES: "${DRAWIO_MAX_UPLOAD_BYTES:-15728640}"
      DRAWIO_AUTH_REQUIRED: "1"
      DRAWIO_COOKIE_SECURE: "1"
      DRAWIO_FORCE_HTTPS: "0"
      DRAWIO_SECRET_KEY: "${DRAWIO_SECRET_KEY}"
      DRAWIO_SESSION_HOURS: "${DRAWIO_SESSION_HOURS:-8}"
      DRAWIO_ADMIN_USERS: "${DRAWIO_ADMIN_USERS:-}"
      DRAWIO_PREVIEW_URL: "${DRAWIO_PREVIEW_URL:-https://embed.diagrams.net/}"
      DRAWIO_RATELIMIT_STORAGE: "redis://redis:6379"
      DRAWIO_ENABLE_SECURITY_HEADERS: "${DRAWIO_ENABLE_SECURITY_HEADERS:-1}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-3}"
      ZABBIX_BASE_URL: "${ZABBIX_BASE_URL:-}"
      ZABBIX_API_URL: "${ZABBIX_API_URL:-}"
      ZABBIX_API_PATH: "${ZABBIX_API_PATH:-/zabbix/api_jsonrpc.php}"
      ZABBIX_API_TOKEN: "${ZABBIX_API_TOKEN:-}"
      ZABBIX_HTTP_TIMEOUT_MS: "${ZABBIX_HTTP_TIMEOUT_MS:-7000}"
      ZABBIX_DEFAULT_GROUP_ID: "${ZABBIX_DEFAULT_GROUP_ID:-}"
      ZABBIX_DEFAULT_PROXY_ID: "${ZABBIX_DEFAULT_PROXY_ID:-}"
      ZABBIX_DEFAULT_TEMPLATE_ID: "${ZABBIX_DEFAULT_TEMPLATE_ID:-}"
      ZABBIX_DEFAULT_MONITORED_BY: "${ZABBIX_DEFAULT_MONITORED_BY:-1}"
      ZABBIX_ROUTEROS_USERNAME: "${ZABBIX_ROUTEROS_USERNAME:-}"
      ZABBIX_ROUTEROS_PASSWORD: "${ZABBIX_ROUTEROS_PASSWORD:-}"
    volumes:
      - drawio_data:/app/data
      - ./library:/app/library:ro
    networks:
      - drawio_internal
    depends_on:
      - redis
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100M

  redis:
    image: redis:7-alpine
    container_name: ausarta-drawio-redis
    restart: unless-stopped
    logging: *default-logging
    # Sin --appendonly: redis solo guarda contadores de rate-limit (efímeros).
    # NO combinar appendonly con read_only/cap_drop (provoca crash-loop por permisos).
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - drawio_internal
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    image: ausarta-drawio-backup:local
    container_name: ausarta-drawio-backup
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: "${TZ:-UTC}"
      DRAWIO_BACKUP_RETENTION_DAYS: "${DRAWIO_BACKUP_RETENTION_DAYS:-7}"
    volumes:
      - drawio_data:/app/data:ro
      - drawio_backup:/backup
    networks:
      - drawio_internal
    depends_on:
      - drawio-generator

volumes:
  drawio_data:
  redis_data:
  drawio_backup:

networks:
  drawio_internal:
    driver: bridge
