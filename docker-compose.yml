services:
  drawio-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ausarta-drawio
    restart: unless-stopped
    # No exponemos el puerto directamente - nginx será el único punto de entrada
    expose:
      - "8000"
    environment:
      GLPI_URL: "${GLPI_URL}"
      GLPI_WEB_URL: "${GLPI_WEB_URL}"
      GLPI_APP_TOKEN: "${GLPI_APP_TOKEN}"
      GLPI_USER_TOKEN: "${GLPI_USER_TOKEN}"
      GLPI_VERIFY_SSL: "${GLPI_VERIFY_SSL:-1}"
      DRAWIO_LIBRARY_PATH: "/app/library/${DRAWIO_LIBRARY_VERSION:-libreria_Ausarta_JUN_2026}.xml"
      DRAWIO_DOWNLOAD_DB: "/app/data/downloads.sqlite3"
      DRAWIO_SITE_DB: "/app/data/sites.sqlite3"
      DRAWIO_CATALOG_DB: "/app/data/catalog.sqlite3"
      DRAWIO_ACTIVITY_DB: "/app/data/activity.sqlite3"
      DRAWIO_SECLOG_DB: "/app/data/security.sqlite3"
      DRAWIO_CATALOG_TTL: "${DRAWIO_CATALOG_TTL:-300}"
      DRAWIO_DOWNLOAD_TTL: "${DRAWIO_DOWNLOAD_TTL:-86400}"
      DRAWIO_MAX_UPLOAD_BYTES: "${DRAWIO_MAX_UPLOAD_BYTES:-15728640}"
      DRAWIO_AUTH_REQUIRED: "1"
      DRAWIO_COOKIE_SECURE: "1"  # Always secure when behind HTTPS proxy
      DRAWIO_FORCE_HTTPS: "0"  # Nginx handles HTTPS
      DRAWIO_SECRET_KEY: "${DRAWIO_SECRET_KEY}"
      DRAWIO_SESSION_HOURS: "${DRAWIO_SESSION_HOURS:-8}"
      DRAWIO_ADMIN_USERS: "${DRAWIO_ADMIN_USERS:-}"
      DRAWIO_PREVIEW_URL: "${DRAWIO_PREVIEW_URL:-https://embed.diagrams.net/}"
      # Rate limiting with Redis (optional - memory:// fallback)
      DRAWIO_RATELIMIT_STORAGE: "redis://redis:6379"
    volumes:
      - drawio_data:/app/data
      - ./library:/app/library:ro
    networks:
      - internal_network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Security: Run with limited capabilities
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100M

  nginx:
    image: nginx:1.25-alpine
    container_name: ausarta-drawio-nginx
    restart: unless-stopped
    ports:
      - "${DRAWIO_PUBLIC_PORT:-443}:443"
      - "${DRAWIO_HTTP_PORT:-80}:80"
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf/live/draw.ausarta.net:/etc/letsencrypt/live/draw.ausarta.net:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    networks:
      - internal_network
      - external_network
    depends_on:
      - drawio-generator
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Security: Run with limited capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: ausarta-drawio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal_network
    # Security: Run with limited capabilities
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50M

  certbot:
    image: certbot/certbot:latest
    container_name: drawio-certbot
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --quiet --webroot --webroot-path=/var/www/certbot;
        sleep 12h & wait $${!};
      done"
    depends_on:
      - nginx
    restart: unless-stopped

  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    image: ausarta-drawio-backup:local
    container_name: ausarta-drawio-backup
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      DRAWIO_BACKUP_RETENTION_DAYS: "${DRAWIO_BACKUP_RETENTION_DAYS:-7}"
    volumes:
      - drawio_data:/app/data:ro
      - drawio_backup:/backup
    depends_on:
      - drawio-generator

volumes:
  drawio_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  drawio_backup:
    driver: local

networks:
  # Red interna: Solo comunicación entre contenedores
  internal_network:
    driver: bridge
    internal: true
  # Red externa: Solo nginx tiene acceso
  external_network:
    driver: bridge

configs:
  nginx_config:
    file: ./nginx.conf
