# docker-compose.portainer.yml
# Versión optimizada para Portainer con nginx custom image
# Usar este archivo en Portainer en lugar del docker-compose.yml estándar

services:
  drawio-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ausarta-drawio
    restart: unless-stopped
    # No exponemos el puerto directamente - nginx será el único punto de entrada
    expose:
      - "8000"
    environment:
      GLPI_URL: "${GLPI_URL}"
      GLPI_WEB_URL: "${GLPI_WEB_URL}"
      GLPI_APP_TOKEN: "${GLPI_APP_TOKEN}"
      GLPI_USER_TOKEN: "${GLPI_USER_TOKEN}"
      DRAWIO_LIBRARY_PATH: "/app/libreria_Ausarta_JUN_2026.xml"
      DRAWIO_DOWNLOAD_DB: "/app/data/downloads.sqlite3"
      DRAWIO_SITE_DB: "/app/data/sites.sqlite3"
      DRAWIO_CATALOG_DB: "/app/data/catalog.sqlite3"
      DRAWIO_ACTIVITY_DB: "/app/data/activity.sqlite3"
      DRAWIO_CATALOG_TTL: "${DRAWIO_CATALOG_TTL:-300}"
      DRAWIO_DOWNLOAD_TTL: "${DRAWIO_DOWNLOAD_TTL:-86400}"
      DRAWIO_MAX_UPLOAD_BYTES: "${DRAWIO_MAX_UPLOAD_BYTES:-15728640}"
      DRAWIO_AUTH_REQUIRED: "1"
      DRAWIO_COOKIE_SECURE: "1"
      DRAWIO_FORCE_HTTPS: "0"
      DRAWIO_SECRET_KEY: "${DRAWIO_SECRET_KEY}"
      DRAWIO_SESSION_HOURS: "${DRAWIO_SESSION_HOURS:-8}"
      DRAWIO_PREVIEW_URL: "${DRAWIO_PREVIEW_URL:-https://embed.diagrams.net/}"
      DRAWIO_RATELIMIT_STORAGE: "redis://redis:6379"
    volumes:
      - drawio_data:/app/data
    networks:
      - internal_network
    depends_on:
      - redis
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100M

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: ausarta-drawio-nginx:latest
    container_name: ausarta-drawio-nginx
    restart: unless-stopped
    ports:
      - "${DRAWIO_PUBLIC_PORT:-443}:443"
      - "${DRAWIO_HTTP_PORT:-80}:80"
    volumes:
      - nginx_ssl:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    networks:
      - internal_network
      - external_network
    depends_on:
      - drawio-generator
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ausarta-drawio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal_network
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50M

volumes:
  drawio_data:
    driver: local
  redis_data:
    driver: local
  nginx_ssl:
    driver: local
  certbot_webroot:
    driver: local
  nginx_logs:
    driver: local

networks:
  internal_network:
    driver: bridge
    internal: true
  external_network:
    driver: bridge
